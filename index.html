    // --- CONEXÃO REAL COM GOOGLE SHEETS ---
    // Carrega gviz via <script> (JSONP) — não está sujeito a CORS, funciona mesmo em file://
    function gvizJsonp(sheetId, sheetName) {
      return new Promise((resolve, reject) => {
        const cb = 'gviz_cb_' + Math.random().toString(36).slice(2);
        const script = document.createElement('script');
        const timeout = setTimeout(() => { limpar(); reject(new Error("Tempo esgotado ao contactar o Google Sheets.")); }, 20000);
        function limpar() {
          clearTimeout(timeout);
          try { delete window[cb]; } catch (e) { window[cb] = undefined; }
          if (script.parentNode) script.parentNode.removeChild(script);
        }
        window[cb] = (resp) => { limpar(); resolve(resp); };
        script.onerror = () => { limpar(); reject(new Error("Falha ao carregar a folha (verifica a partilha pública).")); };
        script.src = `https://docs.google.com/spreadsheets/d/${sheetId}/gviz/tq?tqx=out:json;responseHandler:${cb}&sheet=${encodeURIComponent(sheetName)}`;
        document.head.appendChild(script);
      });
    }

    // Converter várias formas de data para objeto Date (só dia)
    function parseDataPT(s) {
      if (!s) return null;
      s = String(s).trim();
      let m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})/);       // DD/MM/AAAA
      if (m) { const a = +m[3] < 100 ? 2000 + +m[3] : +m[3]; return new Date(a, +m[2] - 1, +m[1]); }
      m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);               // AAAA-MM-DD
      if (m) return new Date(+m[1], +m[2] - 1, +m[3]);
      m = s.match(/Date\((\d+),(\d+),(\d+)/);                    // Date(a,m,d) do gviz
      if (m) return new Date(+m[1], +m[2], +m[3]);
      const d = new Date(s);
      return isNaN(d) ? null : d;
    }

    // Conta os dias úteis (2ª a 6ª feira, excluindo os dias de paragem da empresa) entre duas datas, inclusive
    function diasUteisPortugal(inicio, fim) {
      let total = 0;
      const cursor = new Date(inicio);
      cursor.setHours(0, 0, 0, 0);
      const fimDia = new Date(fim);
      fimDia.setHours(0, 0, 0, 0);
      while (cursor <= fimDia) {
        const diaSemana = cursor.getDay(); // 0 = domingo, 6 = sábado
        if (diaSemana !== 0 && diaSemana !== 6 && !paragensEmpresa.has(cursor.toDateString())) total++;
        cursor.setDate(cursor.getDate() + 1);
      }
      return total;
    }

    // Horas de trabalho esperadas (Portugal) no mês indicado pelos filtros pic-de / pic-ate.
    // Usa o mês/ano do campo "De" (ou "Até" se "De" estiver vazio; ou o mês atual se ambos vazios).
    function horasEsperadasMesPicagens() {
      const refStr = pDe || pAte;
      const ref = refStr ? parseDataPT(refStr) : new Date();
      const inicioMes = new Date(ref.getFullYear(), ref.getMonth(), 1);
      const fimMes = new Date(ref.getFullYear(), ref.getMonth() + 1, 0);
      const HORAS_POR_DIA = 8;
      return diasUteisPortugal(inicioMes, fimMes) * HORAS_POR_DIA;
    }

    // --- CÁLCULO DE ESTATÍSTICAS ---
    function getFirstName(fullName) {
      return fullName.split(' ')[0];
    }

    // Normalizar nomes para comparação (sem acentos, minúsculas, espaços simples)
    function normNome(s) {
      return (s === null || s === undefined ? "" : String(s))
        .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
        .trim().toLowerCase().replace(/\s+/g, " ");
    }

    // Converter "HH:MM(:SS)" (aceita negativos, ex. "-2:00:00") em minutos
    function hhmmParaMinutos(txt) {
      if (txt === null || txt === undefined) return 0;
      const s = String(txt).trim();
      const neg = s.startsWith('-');
      const p = s.replace('-', '').split(':');
      if (p.length < 2) return 0;
      const h = parseInt(p[0], 10) || 0;
      const m = parseInt(p[1], 10) || 0;
      return (neg ? -1 : 1) * (h * 60 + m);
    }

    // Desconta as pausas obrigatórias (10min de manhã + 5min de tarde = 15min) ao tempo trabalhado
    function descontarPausasObrigatorias(min) {
      return Math.max(0, (min || 0) - 15);
    }

    // Converter minutos em "HH:MM"
    function minutosParaHHMM(min) {
      const sinal = min < 0 ? "-" : "";
      const abs = Math.abs(min);
      const h = Math.floor(abs / 60);
      const m = abs % 60;
      return `${sinal}${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}`;
    }

    // Processar uma linha (da folha ou de exemplo) para resumo + picagens
    function processarLinhaHoras(resumo, picagens, c) {
      if (!c.nome || normNome(c.nome) === "colaborador") return;
      const chave = normNome(c.nome);

      const bancoMin = hhmmParaMinutos(c.banco);        // Banco de Horas (extra dias de semana)
      const faltaMin = hhmmParaMinutos(c.falta);        // Tempo em Falta
      const extraFdsMin = hhmmParaMinutos(c.extraFds);  // Tempo Extra (fim de semana)
      const trabMin = hhmmParaMinutos(c.trabalhado);    // Tempo Trabalhado (coluna da folha)
      const saldoMin = hhmmParaMinutos(c.saldo);        // SALDO da folha (já inclui fds e ajustes)
      const incompleto = normNome(c.horarioIncompleto) === "incompleto"; // coluna "Horário Incompleto"

      if (!resumo[chave]) resumo[chave] = { bancoMin: 0, faltaMin: 0, extraFdsMin: 0, saldoMin: 0, dias: 0, vezesExtra: 0, vezesFds: 0, diasFalta: 0 };
      resumo[chave].bancoMin += bancoMin;
      resumo[chave].faltaMin += faltaMin;
      resumo[chave].extraFdsMin += extraFdsMin;
      resumo[chave].saldoMin += saldoMin;
      resumo[chave].dias += 1;
      if (bancoMin > 0) resumo[chave].vezesExtra += 1;      // dias com horas extra (semana)
      if (extraFdsMin > 0) resumo[chave].vezesFds += 1;     // fins de semana trabalhados
      if (faltaMin > 0) resumo[chave].diasFalta += 1;       // dias em que ficou a dever

      if (!picagens[chave]) picagens[chave] = [];
      picagens[chave].push({ nome: c.nome, dia: c.dia, trabalhadoMin: trabMin, faltaMin: faltaMin, saldoMin: saldoMin, incompleto: incompleto, horario: c.horario || '' });
    }

    // Ler a folha de banco de horas / tempo em falta

    function getAttendanceStats(userId) {
      const records = attendanceRecords[userId] || [];
      
      const totalMissing = records.reduce((sum, r) => sum + r.emFalta, 0);
      
      const totalClockedOvertime = records.reduce((sum, r) => {
        const extra = r.horas > 8.0 ? (r.horas - 8.0) : 0;
        return sum + extra;
      }, 0);
      
      const extras = extraHoursCredited[userId] || [];
      const totalExtra = extras.reduce((sum, e) => sum + e.horas, 0);
      
      const totalOvertime = totalClockedOvertime + totalExtra;
      
      const saldoFinalCompensado = totalMissing - totalOvertime;
      const saldoFinal = Math.max(0, saldoFinalCompensado);
      
      return {
        totalMissing: parseFloat(totalMissing.toFixed(2)),
        totalOvertime: parseFloat(totalOvertime.toFixed(2)),
        saldoFinal: parseFloat(saldoFinal.toFixed(2))
      };
    }

    // Registos de picagens do utilizador (unificados): { data, trabalhadoMin, faltaMin, saldoMin, incompleto }
    function getPicagensRecords() {
      if (isHorasConnected) {
        const lista = picagensPorColab[normNome(loggedUser.nome)] || [];
        return lista.map(p => ({
          data: p.dia,
          trabalhadoMin: p.trabalhadoMin,
          faltaMin: p.faltaMin,
          saldoMin: p.saldoMin || 0,
          incompleto: !!p.incompleto,
          horario: p.horario || ''
        }));
      }
      // Fallback (Modo Local): a partir dos dados simulados
      const recs = attendanceRecords[loggedUser.id] || [];
      return recs.map(r => ({
        data: r.data,
        trabalhadoMin: Math.round((r.horas || 0) * 60),
        faltaMin: Math.round((r.emFalta || 0) * 60),
        saldoMin: 0,
        incompleto: (r.emFalta || 0) > 0,
        horario: ''
      }));
    }

    // Agrupar as picagens por semana (segunda a domingo), da mais recente para a mais antiga
    function getWeeksForUser() {
      const recs = getPicagensRecords();

      const parseData = (d) => {
        const p = String(d).split('/');
        const dia = +p[0];
        const mes = (+p[1]) - 1;
        const ano = p[2] ? +p[2] : 2026; // ano assumido se os registos não o trouxerem
        return new Date(ano, mes, dia);
      };

      const segundaDe = (date) => {
        const dt = new Date(date);
        const dow = (dt.getDay() + 6) % 7; // 0 = segunda
        dt.setDate(dt.getDate() - dow);
        dt.setHours(0, 0, 0, 0);
        return dt;
      };

      const mapa = new Map();
      recs.forEach(r => {
        const dt = parseData(r.data);
        if (isNaN(dt)) return;
        const seg = segundaDe(dt);
        const chave = seg.getTime();
        if (!mapa.has(chave)) mapa.set(chave, { segunda: seg, registos: [] });
        mapa.get(chave).registos.push({ ...r, _dt: dt });
      });

      const semanas = Array.from(mapa.values()).sort((a, b) => b.segunda - a.segunda);
      semanas.forEach(s => s.registos.sort((a, b) => b._dt - a._dt));
      return semanas;
    }

      const errBox = document.getElementById('login-error');

      errBox.classList.add('hidden');

      if (userIn.toUpperCase() === "RH" && passIn === "7891") {
        loggedUser = { id: "RH", nome: "Escritório (RH)", setor: "Recursos Humanos", isRH: true };
        document.getElementById('login-username').value = "";
        document.getElementById('login-password').value = "";

        document.getElementById('login-username').value = "";
        document.getElementById('login-password').value = "";
        reRenderAll();
        return;
      }

      const match = colaboradores.find(c => {
        const firstName = getFirstName(c.nome).toLowerCase();
        const cleanInputName = userIn.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
        const cleanFirstName = firstName.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
        return cleanFirstName === cleanInputName && c.pass === passIn;
      });

      if (match) {
        loggedUser = { ...match, isRH: false };
        document.getElementById('login-username').value = "";
        document.getElementById('login-password').value = "";
        activeTab = "dashboard";
        reRenderAll();
      } else {
        errBox.innerText = "Nome ou Senha errada. Por favor, tente outra vez.";
        errBox.classList.remove('hidden');
      }

    function guardarAjuste() {
      const colaborador = document.getElementById('bo-colab').value;
      const sinal = document.getElementById('bo-sinal').value;
      const horas = parseInt(document.getElementById('bo-horas').value, 10) || 0;
      const minutos = parseInt(document.getElementById('bo-min').value, 10) || 0;
      const motivo = document.getElementById('bo-motivo').value.trim();

      if (!colaborador) { triggerToast("Escolha um colaborador."); return; }
      if (horas === 0 && minutos === 0) { triggerToast("Indique um valor de horas/minutos."); return; }

      if (jaTemAjusteHojePara(colaborador) && !confirm(`Já realizou um registo hoje para ${colaborador}. Deseja continuar?`)) {
        return;
      }

      const totalMin = (sinal === '-' ? -1 : 1) * (horas * 60 + minutos);
      const ajusteTxt = (totalMin > 0 ? '+' : '') + minutosParaHHMM(totalMin);

      const registo = {
        colaborador,
        minutos: totalMin,
        ajuste: ajusteTxt,
        motivo,
        data: new Date().toISOString(),
        estado: APPS_SCRIPT_URL ? 'A enviar…' : 'Pré-visualização'
      };
      ajustesSessao.push(registo);
      renderBackofficePanel();

      if (APPS_SCRIPT_URL) {
        fetch(APPS_SCRIPT_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({ colaborador, ajuste: ajusteTxt, minutos: totalMin, motivo, data: registo.data })
        })
        .then(() => { registo.estado = 'Enviado'; renderBackofficePanel(); triggerToast("Ajuste enviado para a folha."); })
        .catch(() => { registo.estado = 'Erro'; renderBackofficePanel(); triggerToast("Falha ao contactar o Google Sheets."); });
      } else {
        triggerToast(`Ajuste registado (pré-visualização): ${colaborador} ${ajusteTxt}`);
      }
    }

    // Ajuste do Saldo a partir do painel RH — tipo 'add' (adicionar) ou 'rem' (retirar)
    function ajusteSaldoRH(id, tipo) {
      const colab = colaboradores.find(c => c.id === id);
      if (!colab) return;
      const input = document.getElementById((tipo === 'rem' ? 'rem-' : 'add-') + id);
      let minutos = hhmmParaMinutos(input ? input.value.trim() : '');
      if (!minutos || minutos <= 0) { triggerToast("Indique um valor positivo, ex.: 1:30"); return; }

      if (jaTemAjusteHojePara(colab.nome) && !confirm(`Já realizou um registo hoje para ${colab.nome}. Deseja continuar?`)) {
        return;
      }

      if (tipo === 'rem') minutos = -minutos; // retirar -> negativo (coluna "Ajuste Horas (retirar)")

      const ajusteTxt = (minutos > 0 ? '+' : '') + minutosParaHHMM(minutos);
      const motivo = tipo === 'rem' ? 'Retirar horas (RH)' : 'Adicionar horas (RH)';
      const chave = normNome(colab.nome);

      // reflexo imediato no ecrã (otimista)
      if (!horasResumo[chave]) horasResumo[chave] = { bancoMin: 0, faltaMin: 0, extraFdsMin: 0, saldoMin: 0, dias: 0, vezesExtra: 0, vezesFds: 0, diasFalta: 0 };
      horasResumo[chave].saldoMin += minutos;

      ajustesSessao.push({ colaborador: colab.nome, minutos, ajuste: ajusteTxt, motivo, data: new Date().toISOString(), estado: APPS_SCRIPT_URL ? 'Enviado' : 'Pré-visualização' });
      renderRHPanel();

      if (APPS_SCRIPT_URL) {
        fetch(APPS_SCRIPT_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({ colaborador: colab.nome, ajuste: ajusteTxt, minutos, motivo, data: new Date().toISOString() })
        })
        .then(() => triggerToast(`Enviado para a folha: ${colab.nome} ${ajusteTxt}`))
        .catch(() => triggerToast(`Falha ao enviar ${ajusteTxt}.`));
      } else {
        triggerToast(`Ajuste registado (pré-visualização): ${colab.nome} ${ajusteTxt}`);
      }
    }

    // Exportar as ausências (calendário) filtradas para XLSX
    function exportarCalendarioXLSX() {
      if (typeof XLSX === 'undefined') { triggerToast("Biblioteca de exportação não carregou (precisa de internet)."); return; }
      const lista = filtrarCalendario();
      if (!lista.length) { triggerToast("Nada para exportar."); return; }
      const dados = lista.map(r => ({
        "Quem?": r.quem,
        "Setor": r.setor,
        "Início": r.inicio,
        "Fim": r.fim,
        "Motivo": r.motivo,
        "Status": r.status,
        "Observações": r.obs,
        "Término": r.termino
      }));
      const ws = XLSX.utils.json_to_sheet(dados);
      ws['!cols'] = [{ wch: 30 }, { wch: 14 }, { wch: 14 }, { wch: 14 }, { wch: 20 }, { wch: 16 }, { wch: 30 }, { wch: 14 }];
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, "Ausencias");
      const hoje = new Date().toISOString().slice(0, 10);
      XLSX.writeFile(wb, `somengil_ausencias_${hoje}.xlsx`);
      triggerToast(`Exportadas ${lista.length} ausência(s) para XLSX.`);
    }

    // Exportar para XLSX os colaboradores selecionados (ou todos se nenhum selecionado)
    function exportarXLSX() {
      if (typeof XLSX === 'undefined') { triggerToast("Biblioteca de exportação não carregou (precisa de internet)."); return; }

      const marcados = Array.from(document.querySelectorAll('.exp-sel:checked')).map(c => c.value);
      let alvo = colaboradores;
      if (marcados.length > 0) {
        alvo = colaboradores.filter(c => marcados.includes(String(c.id)));
      }
      if (!alvo.length) { triggerToast("Nada para exportar."); return; }

      const dados = alvo.map(c => {
        const hr = horasResumo[normNome(c.nome)] || { bancoMin: 0, faltaMin: 0, extraFdsMin: 0, saldoMin: 0 };
        return {
          "Colaborador": c.nome,
          "Setor": c.setor,
          "Férias do ano": c.totalAnual,
          "Férias usadas": c.diasUsados,
          "Férias após fecho": c.diasAposFecho,
          "Banco de horas": minutosParaHHMM(hr.bancoMin),
          "Tempo em falta": minutosParaHHMM(hr.faltaMin),
          "Extra fim de semana": minutosParaHHMM(hr.extraFdsMin),
          "Saldo horas": (hr.saldoMin > 0 ? '+' : '') + minutosParaHHMM(hr.saldoMin)
        };
      });

      const ws = XLSX.utils.json_to_sheet(dados);
      ws['!cols'] = [{ wch: 34 }, { wch: 14 }, { wch: 12 }, { wch: 12 }, { wch: 14 }, { wch: 14 }, { wch: 14 }, { wch: 18 }, { wch: 12 }];
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, "Colaboradores");
      const hoje = new Date().toISOString().slice(0, 10);
      XLSX.writeFile(wb, `somengil_horas_ferias_${hoje}.xlsx`);
      triggerToast(`Exportados ${alvo.length} colaborador(es) para XLSX.`);
    }

              <span>Resumo das minhas Horas de Trabalho</span>
            </h3>
            <div class="${gridCls}">
              ${cards}
            </div>
          </div>
        `;
      } else {
        const semanas = getWeeksForUser();
        if (semanas.length === 0) weekIndex = 0;
        else { if (weekIndex < 0) weekIndex = 0; if (weekIndex > semanas.length - 1) weekIndex = semanas.length - 1; }

        const semanaAtual = semanas[weekIndex] || { registos: [], segunda: null };
        const visibleRecords = semanaAtual.registos;

        const fmt = (dt) => dt.toLocaleDateString('pt-PT', { day: '2-digit', month: '2-digit', year: 'numeric' });
        let labelSemana = "Sem registos";
        if (semanaAtual.segunda) {
          const domingo = new Date(semanaAtual.segunda.getTime() + 6 * 86400000);
          labelSemana = `${fmt(semanaAtual.segunda)} a ${fmt(domingo)}`;
        }

        const podeRecentar = weekIndex > 0;                       // há semana mais recente
        const podeRecuar = weekIndex < semanas.length - 1;        // há semana mais antiga
        const btnBase = "px-4 py-2.5 rounded-xl text-xs font-black transition-all flex items-center justify-center space-x-1.5 border";
        const btnOn = "bg-white text-slate-700 border-slate-300 hover:bg-slate-50";
        const btnOff = "bg-slate-50 text-slate-300 border-slate-200 cursor-not-allowed";

        // Totais acumulados (todas as picagens do colaborador)
        const todos = getPicagensRecords();
        const totalSaldoMin = todos.reduce((s, r) => s + (r.saldoMin || 0), 0);
        const totalIncompletos = todos.reduce((n, r) => n + (r.incompleto ? 1 : 0), 0);
        const saldoColor = totalSaldoMin < 0 ? 'text-red-600' : 'text-emerald-700';
        const incColor = totalIncompletos > 0 ? 'text-red-600' : 'text-emerald-700';
        const fmtSaldo = (m) => (m > 0 ? '+' : '') + minutosParaHHMM(m);

        innerContent = `
          <div class="bg-white border border-slate-200 p-4 rounded-2xl shadow-sm flex items-center justify-between gap-3">
            <button
              onclick="${podeRecuar ? 'prevWeek()' : ''}"
              ${podeRecuar ? '' : 'disabled'}
              class="${btnBase} ${podeRecuar ? btnOn : btnOff}"
            >
              <span>◀</span><span class="hidden sm:inline">Semana anterior</span>
            </button>

            <div class="text-center">
              <span class="text-[10px] uppercase font-bold text-slate-400 block">Semana</span>
              <span class="text-sm font-black text-slate-900">${labelSemana}</span>
            </div>

            <button
              onclick="${podeRecentar ? 'nextWeek()' : ''}"
              ${podeRecentar ? '' : 'disabled'}
              class="${btnBase} ${podeRecentar ? btnOn : btnOff}"
            >
              <span class="hidden sm:inline">Semana seguinte</span><span>▶</span>
            </button>
          </div>

          <div class="grid grid-cols-2 gap-4 text-xs">
            <div class="bg-white border border-slate-200 p-5 rounded-2xl shadow-sm text-center">
              <span class="block text-[11px] font-bold text-slate-500 uppercase tracking-wide">Saldo horas extra</span>
              <span class="block text-3xl font-black mt-2 ${saldoColor}">${fmtSaldo(totalSaldoMin)}</span>
              <span class="text-[10px] text-slate-400 block mt-1 font-medium">${totalSaldoMin < 0 ? 'Está a dever horas' : 'A seu favor'}</span>
            </div>
            <div class="bg-white border border-slate-200 p-5 rounded-2xl shadow-sm text-center">
              <span class="block text-[11px] font-bold text-slate-500 uppercase tracking-wide">Dias incompletos</span>
              <span class="block text-3xl font-black mt-2 ${incColor}">${totalIncompletos}</span>
              <span class="text-[10px] text-slate-400 block mt-1 font-medium">${totalIncompletos === 1 ? '1 dia abaixo do horário' : totalIncompletos + ' dias abaixo do horário'}</span>
            </div>
          </div>

          <div class="bg-white border border-slate-200 rounded-2xl shadow-sm overflow-hidden text-xs">
            <div class="p-4 border-b border-slate-150 flex justify-between items-center bg-slate-50">
              <h4 class="font-bold text-slate-900">O meu registo diário de picagens</h4>
              <span class="text-[10px] uppercase font-bold text-blue-800 bg-blue-100 px-2 py-0.5 rounded-full">Consulta</span>
            </div>

            <div class="overflow-x-auto">
              <table class="min-w-full divide-y divide-slate-150 text-xs">
                <thead class="bg-slate-100 text-slate-700 font-bold uppercase tracking-wider border-b border-slate-200">
                  <tr>
                    <th class="px-4 py-3 text-left">Dia / Data</th>
                    <th class="px-3 py-3 text-left">Horário de Trabalho</th>
                    <th class="px-3 py-3 text-center" style="text-align: center;">Tempo Trabalhado</th>
                    <th class="px-4 py-3 text-right">Saldo do dia</th>
                  </tr>
                </thead>
                <tbody class="divide-y divide-slate-150 font-medium">
                  ${visibleRecords.length === 0 ? `
                    <tr><td colspan="4" class="px-4 py-8 text-center text-slate-400 font-medium">Sem registos para esta semana.</td></tr>
                  ` : visibleRecords.map(rec => {
                    const linhaInc = rec.incompleto;
                    const linhaFds = normNome(rec.horario) === normNome("Horas Extra (fim de semana)");
                    const saldoNeg = (rec.saldoMin || 0) < 0;
                    const diaSem = rec._dt ? rec._dt.toLocaleDateString('pt-PT', { weekday: 'long' }) : '';
                    const trClasse = linhaInc ? 'bg-red-50 hover:bg-red-100' : (linhaFds ? 'bg-amber-50 hover:bg-amber-100' : 'hover:bg-slate-50');
                    return `
                      <tr class="transition-colors ${trClasse}">
                        <td class="px-4 py-3">
                          <div class="font-bold ${linhaInc ? 'text-red-900' : (linhaFds ? 'text-amber-900' : 'text-slate-900')}">${rec.data}</div>
                          <div class="text-[10px] text-slate-400 capitalize">${diaSem}${linhaInc ? ' · Incompleto' : ''}</div>
                        </td>
                        <td class="px-3 py-3 text-slate-600">${rec.horario || '—'}</td>
                        <td class="px-3 py-3 text-center font-mono" style="text-align: center;">
                          <span class="font-bold text-slate-800">${minutosParaHHMM(descontarPausasObrigatorias(rec.trabalhadoMin))}</span>
                        </td>
                        <td class="px-4 py-3 text-right font-mono">
                          <span class="${saldoNeg ? 'text-red-700 bg-red-50' : 'text-emerald-700 bg-emerald-50'} px-2 py-0.5 rounded font-bold">${fmtSaldo(rec.saldoMin || 0)}</span>
                        </td>
                      </tr>
                    `;
                  }).join('')}
                </tbody>
              </table>
            </div>
          </div>
        `;
      }

      container.innerHTML = `
        <div class="bg-white border border-slate-200 text-slate-800 rounded-2xl p-6 shadow-sm flex flex-col md:flex-row justify-between items-start md:items-center gap-4 relative overflow-hidden">
          <div class="z-10">
            <span class="text-[10px] uppercase tracking-wider font-extrabold text-blue-600">A minha área pessoal</span>
            <h2 class="text-xl font-bold text-slate-900 mt-1">Olá, ${getFirstName(loggedUser.nome)}!</h2>
            <p class="text-xs text-slate-500 mt-1">Aqui pode consultar o seu saldo de férias e as suas horas.</p>
          </div>

          <div class="flex flex-wrap gap-3 z-10 w-full md:w-auto">
            <button
              onclick="setTab('dashboard')"
              class="px-5 py-2.5 rounded-xl text-xs font-black border transition-all ${activeTab === 'dashboard' ? 'bg-blue-600 text-white border-blue-600 shadow-sm' : 'bg-white text-slate-700 border-slate-300 hover:bg-slate-50 hover:text-slate-900'}"
            >
              📅 As minhas Férias
            </button>
            <button
              onclick="setTab('horas')"
              class="px-5 py-2.5 rounded-xl text-xs font-black border transition-all ${activeTab === 'horas' ? 'bg-blue-600 text-white border-blue-600 shadow-sm' : 'bg-white text-slate-700 border-slate-300 hover:bg-slate-50 hover:text-slate-900'}"
            >
              📊 Horas
            </button>
            <button
              onclick="setTab('attendance')"
              class="px-5 py-2.5 rounded-xl text-xs font-black border transition-all ${activeTab === 'attendance' ? 'bg-blue-600 text-white border-blue-600 shadow-sm' : 'bg-white text-slate-700 border-slate-300 hover:bg-slate-50 hover:text-slate-900'}"
            >
              ⏰ Picagens
            </button>
          </div>
        </div>

        <div class="space-y-6">
          ${innerContent}
        </div>
      `;
    }

    // --- PWA: instalação e service worker ---
    let deferredInstallPrompt = null;

    function showInstallButton() {
      const btn = document.getElementById('pwa-install-btn');
      if (btn) btn.style.display = 'inline-flex';
    }

    function hideInstallButton() {
      const btn = document.getElementById('pwa-install-btn');
      if (btn) btn.style.display = 'none';
    }

    function isAppInstalled() {
      return window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
    }

    // Chrome/Edge/Android disparam este evento quando a app é instalável
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredInstallPrompt = e;
      if (!isAppInstalled()) showInstallButton();
    });

    window.addEventListener('appinstalled', () => {
      deferredInstallPrompt = null;
      hideInstallButton();
      triggerToast("Aplicação instalada com sucesso!");
    });

    function handleInstallClick() {
      if (deferredInstallPrompt) {
        deferredInstallPrompt.prompt();
        deferredInstallPrompt.userChoice.finally(() => {
          deferredInstallPrompt = null;
          hideInstallButton();
        });
        return;
      }
      // iOS Safari não suporta beforeinstallprompt — mostrar instruções manuais
      triggerToast("Para instalar: toque em Partilhar e depois em 'Adicionar ao Ecrã Principal'.");
    }

    if (!isAppInstalled() && /iphone|ipad|ipod/i.test(navigator.userAgent)) {
      showInstallButton();
    }

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').catch((err) => console.warn('Registo do Service Worker falhou:', err));
      });
    }

    // Inicializar a aplicação quando o DOM estiver pronto
    document.addEventListener("DOMContentLoaded", () => {
      initAttendance();
      seedExemploHoras();   // dados de exemplo disponíveis já (canvas / pré-visualização)
      reRenderAll();
      ligarAoGoogleSheets();
      ligarCredenciais();   // carrega logins/passwords da folha (Colaborador/Password)
      ligarCalendario();    // carrega o separador "Calendário" (ausências/férias)
      ligarHorasSheets();   // se a folha responder, substitui o exemplo pelos dados reais
      ligarParagens();      // carrega o separador "Paragens" (dias de fecho/feriados da empresa)
    });
  </script>

</body>
</html>
